name: Security Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 2 * * 0"

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (critical only)
        run: npm audit --audit-level=critical

  eslint-security:
    name: ESLint Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run security lint checks
        shell: bash
        run: |
          set -euo pipefail

          if node -e "const fs=require('fs'); const c=fs.readFileSync('eslint.config.js','utf8'); process.exit(/security\/detect-object-injection/.test(c) ? 0 : 1)"; then
            echo "Security rules found in eslint.config.js - linting src/ and packages/mke-core/src/ with project config"
            npx eslint src/ packages/mke-core/src/ --ext .ts,.tsx
          else
            echo "Security rules missing in eslint.config.js - running fallback command"
            if ! npm ls eslint-plugin-security >/dev/null 2>&1; then
              npm install --save-dev eslint-plugin-security
            fi

            npx eslint src/ packages/mke-core/src/ --ext .ts,.tsx --plugin security --rule '{"security/detect-object-injection":"warn","security/detect-non-literal-regexp":"warn","security/detect-unsafe-regex":"warn","security/detect-buffer-noassert":"error","security/detect-eval-with-expression":"error","security/detect-no-csrf-before-method-override":"error","security/detect-possible-timing-attacks":"warn"}'
          fi

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan repository for secrets and env files
        shell: bash
        run: |
          set -euo pipefail

          FOUND=0
          SCAN_DIRS=()
          for dir in src data scripts packages; do
            if [ -d "$dir" ]; then
              SCAN_DIRS+=("$dir")
            fi
          done

          if [ "${#SCAN_DIRS[@]}" -gt 0 ]; then
            API_KEY_MATCHES=$(grep -rEnE --include="*.ts" --include="*.tsx" --include="*.json" "sk-[A-Za-z0-9]{20,}" "${SCAN_DIRS[@]}" || true)
            PASSWORD_MATCHES=$(grep -rEnE --include="*.ts" --include="*.tsx" --include="*.json" "password[[:space:]]*[:=][[:space:]]*[\"'][^\"']+" "${SCAN_DIRS[@]}" || true)

            if [ -n "$API_KEY_MATCHES" ]; then
              echo "Potential API keys detected:"
              echo "$API_KEY_MATCHES"
              FOUND=1
            fi

            if [ -n "$PASSWORD_MATCHES" ]; then
              echo "Potential hardcoded secrets detected:"
              echo "$PASSWORD_MATCHES"
              FOUND=1
            fi
          else
            echo "No scan targets found (src/, data/, scripts/)."
          fi

          for env_file in .env .env.local .env.production; do
            if [ -f "$env_file" ]; then
              echo "Disallowed committed env file found: $env_file"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo "Secret scan failed."
            exit 1
          fi

          echo "Secret scan passed."

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dependency licenses
        run: |
          npx --yes license-checker \
            --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;CC0-1.0;CC-BY-4.0;Unlicense;Python-2.0;BlueOak-1.0.0' \
            --excludePrivatePackages
