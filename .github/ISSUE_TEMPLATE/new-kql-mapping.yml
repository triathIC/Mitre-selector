name: KQL Query Contribution
description: Contribute a KQL detection or hunting query mapped to a MITRE ATT&CK technique
title: "KQL Contribution: "
labels: ["contribution"]
body:
  - type: input
    id: technique_id
    attributes:
      label: MITRE ATT&CK Technique ID
      description: "e.g. T1059.001"
      placeholder: "T1059.001"
    validations:
      required: true
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - Microsoft Sentinel
        - Defender XDR
    validations:
      required: true
  - type: input
    id: data_connector
    attributes:
      label: Data Connector
      description: "e.g. Microsoft Defender for Endpoint, Microsoft Entra ID"
      placeholder: "Microsoft Defender for Endpoint"
    validations:
      required: true
  - type: input
    id: log_sources
    attributes:
      label: Log Sources
      description: "Comma-separated table names, e.g. DeviceProcessEvents, SigninLogs"
      placeholder: "DeviceProcessEvents"
    validations:
      required: true
  - type: dropdown
    id: query_type
    attributes:
      label: Query Type
      options:
        - detection
        - hunting
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - critical
        - high
        - medium
        - low
        - informational
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: Confidence Level
      options:
        - production
        - testing
        - experimental
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Query Title
      description: "Short descriptive title"
      placeholder: "Suspicious PowerShell Execution with Encoded Command"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What does this query detect and why is it relevant? 2-3 sentences."
    validations:
      required: true
  - type: textarea
    id: kql
    attributes:
      label: KQL Query
      description: "Paste the full KQL query. Must be syntactically valid."
      render: shell
    validations:
      required: true
  - type: textarea
    id: tuning_notes
    attributes:
      label: Tuning Notes (optional)
      description: "Known false positives, recommended exclusions, environment-specific adjustments"
  - type: input
    id: references
    attributes:
      label: References
      description: "Comma-separated URLs (MITRE, Microsoft Docs, blog posts)"
      placeholder: "https://attack.mitre.org/techniques/T1059/001/"
    validations:
      required: true
